name: ci

# workflow_dispatch launches a run by hand, for a push whose commits would
# otherwise skip CI, without pushing another commit.
#
# push is filtered to the branches that are merge targets: a feature branch is
# tested by its pull_request event, and a push run on the same commit would
# repeat the whole pipeline for no extra information.
on:
  push:
    branches:
      - main
      - 'MOODLE_*_STABLE'
  pull_request:
  workflow_dispatch:

# Supersede a run when new commits arrive on the same pull request: pushing
# three fixes in a row otherwise leaves three full pipelines running to the end.
# Only pull requests are superseded: a push to a merge target is the only run its
# commit will ever get, and a second merge landing quickly must not cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # This branch supports Moodle 5.1 only ($plugin->supported = [501, 501]); the
  # other versions live on main (5.3) and the other MOODLE_*_STABLE branches.
  # The only job runs the full PHP x DB matrix. PHPUnit and Behat run on every
  # runtime leg. The certificate plugins are installed from their upstream
  # branches that support Moodle 5.1.
  ci-501:
    name: Moodle 5.01
    uses: uaiblaine/moodle-workflows/.github/workflows/moodle-plugin-ci.yml@main
    with:
      runner: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || '' }}
      moodle-core-branch: MOODLE_501_STABLE
      plugin-dependencies: |
        mdjnelson/moodle-mod_customcert,MOODLE_500_STABLE
        moodleworkplace/moodle-tool_certificate,MOODLE_500_STABLE
