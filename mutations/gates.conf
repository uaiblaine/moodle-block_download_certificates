# Mutation spec for block_download_certificates, run with
#
#   ~/dev/moodle-dev-dlcerts/bin/mdl-mutate moodle-block_download_certificates mutations/gates.conf --fast --db pgsql --jobs 4
#
# (and the same with --db mariadb). Add --dry-run for the pre-flight that applies every pattern to a
# copy and runs no test. See mutations/README.md.
#
# Each gate breaks ONE guard and names, under it, the test written to redden because of it. That
# pairing is the claim this file keeps executable: a guard whose mutation reddens nothing is held by
# no test, whatever its comment says. A gate with no `#   -> ` line is expected to expose a missing
# test; its comment says why.
#
#     tag | file relative to the repo | perl script relative to this file


